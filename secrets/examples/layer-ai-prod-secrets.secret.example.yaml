# Example only — prod namespace bundle secret (see docs/deploy-prod.md).
# Include only keys your images read; gateway-api and orchestrator share this object in ai-prod.
apiVersion: v1
kind: Secret
metadata:
  name: layer-ai-prod-secrets
  namespace: ai-prod
type: Opaque
stringData:
  SUPABASE_URL: "https://YOUR_PROD_PROJECT.supabase.co"
  SUPABASE_ANON_KEY: "REPLACE_PROD_ANON_KEY"
  TAVILY_API_KEY: "REPLACE_PROD_TAVILY_KEY"
  # Guest /chat (optional): openssl rand -hex 32 — shared by web BFF + gateway-api
  # GUEST_CHAT_SERVICE_TOKEN: "REPLACE_LONG_RANDOM_SECRET"
  # Supabase Dashboard (prod project only): Site URL https://taixingai.com
  # Redirect URLs: https://taixingai.com/auth/reset-password (+ www + optional LAN 30386)
  # LANGCHAIN_API_KEY: "REPLACE_OPTIONAL"
