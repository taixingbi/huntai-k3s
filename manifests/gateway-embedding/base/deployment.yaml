# Gateway embedding — routes /v1/embeddings to GPU-node backends.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: layer-gateway-embedding
  labels:
    environment: dev
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: layer-gateway-embedding
  template:
    metadata:
      labels:
        environment: dev
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - server-node-1
      automountServiceAccountToken: false
      containers:
        - name: gateway
          image: ghcr.io/taixingbi/layer-gateway-embed-v1
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: GATEWAY_CONFIG
              value: /app/config.yaml
            - name: LOG_LEVEL
              value: INFO
            - name: LOG_JSON
              value: "true"
            - name: ENVIRONMENT
              value: "ai-dev"
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: layer-gateway-embedding-config
