# Gateway embedding — routes /v1/embeddings to GPU-node backends.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: layer-gateway-embedding
  labels:
    environment: dev
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: layer-gateway-embedding
  template:
    metadata:
      labels:
        environment: dev
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - server-node-1
      automountServiceAccountToken: false
      containers:
        - name: gateway
          image: ghcr.io/taixingbi/layer-gateway-embed-v1:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: GATEWAY_HOST
              value: "0.0.0.0"
            - name: GATEWAY_PORT
              value: "8000"
            - name: EMBED_BACKENDS
              value: "embed-node-1=http://vllm-embed-gpu-node-1.ai.svc.cluster.local:8001,embed-node-2=http://vllm-embed-gpu-node-2.ai.svc.cluster.local:8001"
            - name: TIMEOUT_CONNECT_MS
              value: "1000"
            - name: TIMEOUT_READ_MS
              value: "15000"
            - name: RETRY_MAX_ATTEMPTS
              value: "2"
            - name: ADMISSION_MAX_CONCURRENT
              value: "100"
            - name: ADMISSION_WAIT_TIMEOUT_MS
              value: "500"
            - name: CB_FAILURE_THRESHOLD
              value: "5"
            - name: CB_RESET_TIMEOUT_SEC
              value: "30"
            - name: ROUTING_INFLIGHT_WEIGHT
              value: "20.0"
            - name: ROUTING_LATENCY_WEIGHT
              value: "0.5"
            - name: ROUTING_ERROR_WEIGHT
              value: "100.0"
            - name: ROUTING_EXPLORATION_RATE
              value: "0.15"
            - name: ROUTING_MAX_IDLE_MS
              value: "500"
            - name: LOG_LEVEL
              value: INFO
            - name: LOG_JSON
              value: "true"
            - name: ENVIRONMENT
              value: "ai-dev"
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 512Mi
