# layer-mcp-github-v1 — MCP streamable-http: POST /v1/mcp (github_search).
# Source: https://github.com/taixingbi/layer-mcp-github-v1
# Requires: layer-gateway-inference in ai-dev; GITHUB_TOKEN in layer-mcp-github-v1-secrets.
# K8s name + app label: layer-mcp-github (same as layer-rag-query, layer-orchestrator). Image/repo/secret keep -v1.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: layer-mcp-github
  labels:
    environment: dev
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: layer-mcp-github
  template:
    metadata:
      labels:
        environment: dev
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - server-node-1
      automountServiceAccountToken: false
      containers:
        - name: mcp-github
          image: ghcr.io/taixingbi/layer-mcp-github-v1
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: layer-mcp-github-v1-secrets
          env:
            - name: HTTP_HOST
              value: "0.0.0.0"
            - name: HTTP_PORT
              value: "8000"
            - name: GITHUB_OWNER
              value: "taixingbi"
            - name: LLM_GATEWAY_BASE_URL
              value: "http://layer-gateway-inference:8000"
            - name: LLM_MODEL
              value: "Qwen/Qwen2.5-7B-Instruct"
            - name: LLM_MAX_TOKENS
              value: "512"
            - name: LLM_TEMPERATURE
              value: "0.7"
            - name: GITHUB_SEARCH_FOLLOW_UPS
              value: "true"
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 512Mi
