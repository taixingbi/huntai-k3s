# RAG query — hybrid retrieval + /v1/rag/query (FastMCP HTTP).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: layer-rag-query
  labels:
    environment: dev
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: layer-rag-query
  template:
    metadata:
      labels:
        environment: dev
    spec:
      nodeSelector:
        kubernetes.io/hostname: server-node-1
      automountServiceAccountToken: false
      containers:
        - name: rag-query
          image: docker.io/taixingbi/layer-rag-query-v1:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: HTTP_PORT
              value: "8000"
            - name: QDRANT_URL
              value: "http://192.168.86.179:6333"
            - name: QDRANT_API_KEY
              value: ""
            - name: EMBEDDING_URL
              value: "http://192.168.86.179:30181"
            - name: EMBEDDING_MODEL
              value: "BAAI/bge-m3"
            - name: VECTOR_SIZE
              value: "1024"
            - name: ENV
              value: "dev"
            - name: TOP_K_DENSE
              value: "20"
            - name: RRF_K
              value: "60"
            - name: INFERENCE_URL
              value: "http://192.168.86.179:30180"
            - name: INFERENCE_MODEL
              value: "Qwen/Qwen2.5-7B-Instruct"
            - name: RERANK_URL
              value: "http://192.168.86.179:30182"
            - name: RERANK_MODEL
              value: "BAAI/bge-reranker-v2-m3"
            - name: RERANK_TOP_N
              value: "50"
            - name: RERANK_RETURN_TOP_K
              value: "25"
            - name: RETRIEVE_FALLBACK_N
              value: "8"
            - name: FINAL_CONTEXT_TOP_K
              value: "12"
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
