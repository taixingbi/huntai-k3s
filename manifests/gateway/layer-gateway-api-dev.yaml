# Gateway API — dev (NodePort 30185; pod + ClusterIP listen on 8000). Scheduled on server-node-1 (control plane — watch CPU/RAM).
# FastAPI edge: auth stub, /api/chat → orchestrator, feedback. Source: https://github.com/taixingbi/layer-gateway-api-v1
# In-cluster orchestrator: ORCHESTRATOR_BASE_URL (not LAN NodePort). Env names match upstream .env.example / app/core/config.py.
#
# Optional: sudo k3s ctr images pull docker.io/taixingbi/layer-gateway-api-v1:latest

apiVersion: v1
kind: Namespace
metadata:
  name: ai-dev
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: layer-gateway-api
  namespace: ai-dev
  labels:
    app: layer-gateway-api
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: layer-gateway-api
  template:
    metadata:
      labels:
        app: layer-gateway-api
        environment: dev
    spec:
      nodeSelector:
        kubernetes.io/hostname: server-node-1
      automountServiceAccountToken: false
      containers:
        - name: gateway
          image: docker.io/taixingbi/layer-gateway-api-v1:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: APP_NAME
              value: "layer-gateway-api-v1"
            - name: SERVICE_NAME
              value: "gateway-api"
            - name: ENV
              value: "dev"
            - name: MAX_INFLIGHT_REQUESTS
              value: "100"
            - name: ORCHESTRATOR_BASE_URL
              value: "http://layer-orchestrator:8000"
            - name: ORCHESTRATOR_CHAT_PATH
              value: "/orchestrator/answer"
            - name: ORCHESTRATOR_FEEDBACK_PATH
              value: "/feedback"
            - name: ORCHESTRATOR_CONTRACT
              value: "flat_headers"
            - name: ORCHESTRATOR_TIMEOUT_MS
              value: "15000"
            - name: ORCHESTRATOR_RETRY_MAX_ATTEMPTS
              value: "2"
            - name: ORCHESTRATOR_READINESS_PATH
              value: "/health"
            - name: ORCHESTRATOR_READINESS_TIMEOUT_MS
              value: "3000"
            - name: ORCHESTRATOR_READINESS_PROBE_ENABLED
              value: "true"
            - name: AUTH_MODE
              value: "stub"
            - name: AUTH_STUB_USER_ID
              value: "taixing"
            - name: AUTH_STUB_TENANT_ID
              value: "tenant_01"
            - name: AUTH_STUB_ROLES
              value: "hr"
            - name: AUTH_STUB_GROUPS
              value: "engineering"
            - name: AUTH_STUB_TEAMS
              value: "rag-platform"
            - name: CHAT_MESSAGE_MAX_LENGTH
              value: "4000"
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: layer-gateway-api
  namespace: ai-dev
  labels:
    app: layer-gateway-api
    environment: dev
spec:
  type: NodePort
  selector:
    app: layer-gateway-api
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 30185
