# Gateway API — dev (NodePort 30185; pod + ClusterIP listen on 8000). Scheduled on server-node-1 (control plane — watch CPU/RAM).
# FastAPI edge: Supabase or JWKS auth, POST /v1/chat → orchestrator, POST /v1/feedback → Supabase. Source: https://github.com/taixingbi/layer-gateway-api-v1
# In-cluster orchestrator: ORCHESTRATOR_BASE_URL (not LAN NodePort). Env names match upstream .env.example / app/core/config.py.
# Auth secrets: create `layer-gateway-api-secrets` before rollout (see docs/deploy-gateway-api.md).
# FRONTEND_URL=https://dev.taixingai.com (Cloudflare Tunnel; match layer-web APP_URL + Supabase Site URL).
#
# Optional: sudo k3s ctr images pull docker.io/taixingbi/layer-gateway-api-v1:latest

apiVersion: v1
kind: Namespace
metadata:
  name: ai-dev
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: layer-gateway-api
  namespace: ai-dev
  labels:
    app: layer-gateway-api
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: layer-gateway-api
  template:
    metadata:
      labels:
        app: layer-gateway-api
        environment: dev
    spec:
      nodeSelector:
        kubernetes.io/hostname: server-node-1
      automountServiceAccountToken: false
      containers:
        - name: gateway
          image: docker.io/taixingbi/layer-gateway-api-v1:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: layer-gateway-api-secrets
          env:
            - name: APP_NAME
              value: "layer-gateway-api-v1"
            - name: SERVICE_NAME
              value: "gateway-api"
            - name: ENV
              value: "dev"
            - name: MAX_INFLIGHT_REQUESTS
              value: "100"
            - name: ORCHESTRATOR_BASE_URL
              value: "http://layer-orchestrator:8000"
            - name: ORCHESTRATOR_CHAT_PATH
              value: "/v1/orchestrator/answer"
            - name: CHAT_ASSISTANT_MODEL
              value: "qwen2.5-7b"
            - name: ORCHESTRATOR_FEEDBACK_PATH
              value: "/feedback"
            - name: ORCHESTRATOR_CONTRACT
              value: "flat_headers"
            - name: ORCHESTRATOR_TIMEOUT_MS
              value: "15000"
            - name: ORCHESTRATOR_RETRY_MAX_ATTEMPTS
              value: "2"
            - name: ORCHESTRATOR_READINESS_PATH
              value: "/health"
            - name: ORCHESTRATOR_READINESS_TIMEOUT_MS
              value: "3000"
            - name: ORCHESTRATOR_READINESS_PROBE_ENABLED
              value: "true"
            - name: FRONTEND_URL
              value: "https://dev.taixingai.com"
            - name: JWT_EXPIRY_SECONDS
              value: "3600"
            - name: CHAT_MESSAGE_MAX_LENGTH
              value: "4000"
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: layer-gateway-api
  namespace: ai-dev
  labels:
    app: layer-gateway-api
    environment: dev
    workload: gateway-api
spec:
  type: NodePort
  selector:
    app: layer-gateway-api
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 30185
