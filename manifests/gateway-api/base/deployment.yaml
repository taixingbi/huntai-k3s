# Gateway API — FastAPI edge. Source: https://github.com/taixingbi/layer-gateway-api-v1
# Auth secrets: create layer-gateway-api-secrets before rollout (see docs/deploy-gateway-api.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: layer-gateway-api
  labels:
    environment: dev
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: layer-gateway-api
  template:
    metadata:
      labels:
        environment: dev
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - server-node-1
      automountServiceAccountToken: false
      containers:
        - name: gateway
          image: ghcr.io/taixingbi/layer-gateway-api-v1
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: layer-gateway-api-secrets
          env:
            - name: APP_NAME
              value: "layer-gateway-api-v1"
            - name: SERVICE_NAME
              value: "gateway-api"
            - name: ENV
              value: "dev"
            - name: MAX_INFLIGHT_REQUESTS
              value: "16"
            - name: MAX_CONCURRENT_CHAT_STREAMS
              value: "8"
            - name: MAX_CONCURRENT_STREAMS_PER_USER
              value: "2"
            - name: RATE_LIMIT_CHAT_REQUESTS_PER_MIN
              value: "6"
            - name: RATE_LIMIT_CHAT_BURST
              value: "2"
            - name: ORCHESTRATOR_BASE_URL
              value: "http://layer-orchestrator:8000"
            - name: ORCHESTRATOR_CHAT_PATH
              value: "/v1/orchestrator/answer"
            - name: CHAT_ASSISTANT_MODEL
              value: "qwen2.5-7b"
            - name: ORCHESTRATOR_FEEDBACK_PATH
              value: "/feedback"
            - name: ORCHESTRATOR_CONTRACT
              value: "flat_headers"
            - name: ORCHESTRATOR_TIMEOUT_MS
              value: "120000"
            - name: ORCHESTRATOR_RETRY_MAX_ATTEMPTS
              value: "2"
            - name: ORCHESTRATOR_READINESS_PATH
              value: "/health"
            - name: ORCHESTRATOR_READINESS_TIMEOUT_MS
              value: "3000"
            - name: ORCHESTRATOR_READINESS_PROBE_ENABLED
              value: "true"
            - name: FRONTEND_URL
              value: "https://dev.taixingai.com"
            - name: JWT_EXPIRY_SECONDS
              value: "3600"
            - name: CHAT_MESSAGE_MAX_LENGTH
              value: "4000"
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 512Mi
