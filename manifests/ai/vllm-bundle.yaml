# Per-GPU-node vLLM bundle (C1): one Pod, one container, three vLLM processes (chat/embed/rerank).
# GPU nodes: gpu-node-1, gpu-node-2. See docs/deploy-vllm-inference.md for rollout and VRAM tuning.
apiVersion: v1
kind: Namespace
metadata:
  name: ai
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-bundle-gpu-node-1
  namespace: ai
  labels:
    app: vllm-bundle
    vllm-node: gpu-node-1
spec:
  progressDeadlineSeconds: 7200
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: vllm-bundle
      vllm-node: gpu-node-1
  template:
    metadata:
      labels:
        app: vllm-bundle
        vllm-node: gpu-node-1
      annotations:
        # Bump when vllm-bundle-start ConfigMap script changes (ConfigMap alone does not restart pods).
        huntai.ai/vllm-bundle-start-revision: "5"
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      runtimeClassName: nvidia
      dnsPolicy: Default
      nodeSelector:
        kubernetes.io/hostname: gpu-node-1
      initContainers:
        - name: prefetch-hf-cache
          image: vllm/vllm-openai:latest
          command: ["/bin/bash", "/scripts/prefetch-hf-models.sh"]
          env:
            - name: HF_HOME
              value: /root/.cache/huggingface
            - name: HF_HUB_ENABLE_HF_TRANSFER
              value: "1"
            # Set false when chat runs without router LoRAs.
            - name: PREFETCH_ROUTER_LORAS
              value: "true"
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 8Gi
          volumeMounts:
            - name: bundle-scripts
              mountPath: /scripts
              readOnly: true
            - name: hf-cache
              mountPath: /root/.cache/huggingface
      containers:
        - name: vllm-bundle
          image: vllm/vllm-openai:latest
          command: ["/bin/bash", "/scripts/start-vllm-bundle.sh"]
          ports:
            - name: chat-http
              containerPort: 8000
            - name: embed-http
              containerPort: 8001
            - name: rerank-http
              containerPort: 8002
          env:
            - name: HF_HOME
              value: /root/.cache/huggingface
            - name: HF_HUB_ENABLE_HF_TRANSFER
              value: "1"
          resources:
            limits:
              nvidia.com/gpu: "1"
            requests:
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: bundle-scripts
              mountPath: /scripts
              readOnly: true
            - name: dshm
              mountPath: /dev/shm
            - name: hf-cache
              mountPath: /root/.cache/huggingface
          startupProbe:
            exec:
              command: ["python3", "/scripts/healthcheck.py"]
            periodSeconds: 15
            timeoutSeconds: 10
            # Init prefetch + vLLM load; 360*15s = 90m budget.
            failureThreshold: 360
          readinessProbe:
            exec:
              command: ["python3", "/scripts/healthcheck.py"]
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["python3", "/scripts/healthcheck.py"]
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 5
      volumes:
        - name: bundle-scripts
          configMap:
            name: vllm-bundle-start
            defaultMode: 0755
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
        - name: hf-cache
          hostPath:
            path: /data/hf-cache
            type: DirectoryOrCreate
---
