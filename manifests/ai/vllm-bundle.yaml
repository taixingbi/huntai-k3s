---
apiVersion: v1
kind: Service
metadata:
  name: vllm-inference
  namespace: ai
  labels:
    app: vllm-bundle
spec:
  type: ClusterIP
  selector:
    app: vllm-bundle
  ports:
    - name: http
      port: 8000
      targetPort: chat-http
---
apiVersion: v1
kind: Service
metadata:
  name: inference-qwen25-7b
  namespace: ai
  labels:
    app: vllm-bundle
spec:
  type: NodePort
  selector:
    app: vllm-bundle
  ports:
    - name: http
      port: 8000
      targetPort: chat-http
      nodePort: 30080
---
