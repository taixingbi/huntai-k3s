# Entrypoint for vLLM bundle (C1): one container, three vLLM processes on one GPU.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vllm-bundle-start
  namespace: ai
data:
  start-vllm-bundle.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    log() { echo "[bundle] $*"; }

    trap 'log "shutting down"; jobs -p | xargs -r kill 2>/dev/null || true' EXIT TERM INT

    # vLLM 0.22: no --task on "vllm serve"; pooling/rerank models auto-detect.
    log "starting embed (BAAI/bge-m3) on :8001"
    vllm serve BAAI/bge-m3 \
      --host 0.0.0.0 --port 8001 \
      --hf-overrides '{"architectures": ["BgeM3EmbeddingModel"]}' \
      --gpu-memory-utilization 0.15 \
      --max-model-len 8192 \
      &

    log "starting rerank (BAAI/bge-reranker-v2-m3) on :8002"
    vllm serve BAAI/bge-reranker-v2-m3 \
      --host 0.0.0.0 --port 8002 \
      --gpu-memory-utilization 0.10 \
      --max-model-len 512 \
      &

    log "starting chat (Qwen2.5-7B-Instruct + LoRA) on :8000"
    vllm serve Qwen/Qwen2.5-7B-Instruct \
      --host 0.0.0.0 --port 8000 \
      --gpu-memory-utilization 0.50 \
      --max-model-len 3072 \
      --max-num-seqs 4 \
      --enable-lora \
      --max-lora-rank 64 \
      --max-loras 4 \
      --lora-modules router-qwen2.5-7b-sft-v1.00=taixingbi/router-qwen2.5-7b-sft-v1.00 router-qwen2.5-7b-dpo-v1.00=taixingbi/router-qwen2.5-7b-dpo-v1.00 \
      &

    log "all vLLM processes launched; waiting for any exit"
    while true; do
      if ! wait -n; then
        log "a vLLM process exited with error"
        exit 1
      fi
    done

  healthcheck.py: |
    import sys
    import urllib.error
    import urllib.request

    endpoints = (("chat", 8000), ("embed", 8001), ("rerank", 8002))
    failed = []
    for name, port in endpoints:
        url = f"http://127.0.0.1:{port}/health"
        try:
            urllib.request.urlopen(url, timeout=3)
            print(f"ok {name} {url}")
        except (urllib.error.URLError, TimeoutError) as e:
            print(f"FAIL {name} {url}: {e}", file=sys.stderr)
            failed.append(name)
    if failed:
        print(f"not ready: {', '.join(failed)}", file=sys.stderr)
        sys.exit(1)
    sys.exit(0)
