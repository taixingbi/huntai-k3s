  name: vllm-embed-gpu-node-2
  namespace: ai
subsets:
  - addresses:
      - ip: 192.168.86.176
    ports:
      - name: http
        port: 8001
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-rerank-gpu-node-1
  namespace: ai
  labels:
    app: vllm-rerank-external
    node: gpu-node-1
