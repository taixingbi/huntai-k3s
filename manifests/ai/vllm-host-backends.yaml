# vLLM embed/rerank on GPU node host ports (not yet Kubernetes Deployments).
# Services + Endpoints give stable in-cluster DNS; LAN IPs live only here.
# GPU nodes: gpu-node-1 (192.168.86.173), gpu-node-2 (192.168.86.176).
apiVersion: v1
kind: Service
metadata:
  name: vllm-embed-gpu-node-1
  namespace: ai
  labels:
    app: vllm-embed-external
    node: gpu-node-1
spec:
  ports:
    - name: http
      port: 8001
      targetPort: 8001
---
apiVersion: v1
kind: Endpoints
metadata:
  name: vllm-embed-gpu-node-1
  namespace: ai
subsets:
  - addresses:
      - ip: 192.168.86.173
    ports:
      - name: http
        port: 8001
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-embed-gpu-node-2
  namespace: ai
  labels:
    app: vllm-embed-external
