# Prometheus scrape config + remote_write (ConfigMap prometheus-config).
# only Prometheus + remote_write live here. Use Grafana Cloud for dashboards.
# Scrapes (filter in Grafana with label workload=inference|gateway-inference|gateway-embedding|gateway-api|rag-query|embedding|reranker|gpu-telemetry):
#   - workload=inference: vLLM chat/completions via Service vllm-inference (vllm)
#   - workload=gateway-inference: chat routing gateway /metrics (Service layer-gateway-inference, ai-dev)
#   - workload=gateway-embedding: embed routing gateway /metrics (Service layer-gateway-embedding, ai-dev)
#   - workload=gateway-api: FastAPI edge gateway /metrics (Service layer-gateway-api, ai-dev)
#   - workload=rag-query: RAG query FastMCP HTTP /metrics (Service layer-rag-query, ai-dev) when exposed by the image
#   - workload=gpu-telemetry: DCGM per-GPU metrics (gpu-operator)
#   - workload=embedding: vLLM embed per-node Services vllm-embed-gpu-node-* (vllm)
#   - workload=reranker: vLLM rerank per-node Services vllm-rerank-gpu-node-* (vllm)
# Stack aligns with: https://github.com/taixingbi/layer-observability-grafana
# Pod logs → Grafana Cloud Loki: companion manifest `alloy-loki-cloud.yaml` (Alloy DaemonSet, loki.write).
#
# Apply after vLLM + `vllm-inference` exist in `vllm`, and GPU Operator exposes
# DCGM Service in `gpu-operator` (port 9400, /metrics); name usually ends with `dcgm-exporter`.
# Prometheus TSDB uses PVC `prometheus-data` (storageClassName: local-path for k3s).
# Change storageClassName if your cluster uses a different default provisioner.
#
# Grafana Cloud remote_write: create Secret `prometheus-grafana-cloud-remote-write` manually
# (metrics:write token in key `api-key`). Not in Git — Argo must not manage or overwrite it.
# See secrets/README.md and docs/deploy-prometheus.md. Edit push URL / instance id below.

apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: k3s

    # Grafana Cloud Prometheus (remote write). Auth: instance id + API token file.
    remote_write:
      - url: https://prometheus-prod-56-prod-us-east-2.grafana.net/api/prom/push
        basic_auth:
          username: "3067716"
          password_file: /etc/prometheus/grafana-cloud/api-key
        queue_config:
          max_samples_per_send: 1000
          batch_send_deadline: 5s
          min_backoff: 30ms
          max_backoff: 100ms

    scrape_configs:
      # vLLM inference (chat / completions): one target per pod behind Service vllm-inference.
      - job_name: vllm-inference
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - vllm
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: vllm-inference
          # Avoid 3× scrape per pod (node IP + pod IP + hostname); keep one target per pod.
          - source_labels: [__meta_kubernetes_endpoint_address_target_kind]
            action: keep
            regex: Pod
          - action: labelmap
            regex: __meta_kubernetes_service_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: kubernetes_pod_name
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: kubernetes_node
          - source_labels: [__meta_kubernetes_pod_label_vllm_node]
            target_label: node
          - target_label: workload
            replacement: inference

      # Inference routing gateway (FastAPI): Prometheus metrics on /metrics.
      - job_name: layer-gateway-inference
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - ai-dev
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: layer-gateway-inference
          - action: labelmap
            regex: __meta_kubernetes_service_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: kubernetes_pod_name
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: kubernetes_node
          - target_label: workload
            replacement: gateway-inference

      # Embedding routing gateway (FastAPI): Prometheus metrics on /metrics.
      - job_name: layer-gateway-embedding
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - ai-dev
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: layer-gateway-embedding
          - action: labelmap
            regex: __meta_kubernetes_service_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: kubernetes_pod_name
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: kubernetes_node
          - target_label: workload
            replacement: gateway-embedding

      # Gateway API (FastAPI): Prometheus metrics on /metrics (ai-dev + ai-prod).
      - job_name: layer-gateway-api
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - ai-dev
                - ai-prod
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: layer-gateway-api
          - action: labelmap
            regex: __meta_kubernetes_service_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: kubernetes_pod_name
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: kubernetes_node
          - target_label: workload
            replacement: gateway-api
          - source_labels: [__meta_kubernetes_namespace]
            target_label: environment

      # Orchestrator: Prometheus /metrics (ai-dev + ai-prod).
      - job_name: layer-orchestrator
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - ai-dev
                - ai-prod
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: layer-orchestrator
          - action: labelmap
            regex: __meta_kubernetes_service_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: kubernetes_pod_name
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: kubernetes_node
          - target_label: workload
            replacement: orchestrator
          - source_labels: [__meta_kubernetes_namespace]
            target_label: environment

      # RAG query (FastMCP HTTP): Prometheus /metrics (ai-dev + ai-prod).
      - job_name: layer-rag-query
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - ai-dev
                - ai-prod
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: layer-rag-query
          - action: labelmap
            regex: __meta_kubernetes_service_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: kubernetes_pod_name
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: kubernetes_node
          - target_label: workload
            replacement: rag-query
          - source_labels: [__meta_kubernetes_namespace]
            target_label: environment

      # GPU hardware metrics (not vLLM): DCGM DaemonSet, one target per node.
      - job_name: dcgm-exporter
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - gpu-operator
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: ^.*dcgm-exporter$
          - source_labels: [__meta_kubernetes_namespace]
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: kubernetes_pod_name
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: kubernetes_node
          - target_label: workload
            replacement: gpu-telemetry

      # vLLM embedding (BGE): one target per bundle pod via per-node Services.
      - job_name: vllm-embedding
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - vllm
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: vllm-embed-gpu-node-.*
          - source_labels: [__meta_kubernetes_endpoint_address_target_kind]
            action: keep
            regex: Pod
          - action: labelmap
            regex: __meta_kubernetes_service_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: kubernetes_pod_name
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: kubernetes_node
          - source_labels: [__meta_kubernetes_service_name]
            regex: vllm-embed-gpu-node-(.*)
            target_label: node
            replacement: gpu-node-$1
          - target_label: workload
            replacement: embedding
          - target_label: service
            replacement: embedding
          - target_label: model
            replacement: BAAI/bge-m3

      # vLLM reranker: one target per bundle pod via per-node Services.
      - job_name: vllm-reranker
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - vllm
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: vllm-rerank-gpu-node-.*
          - source_labels: [__meta_kubernetes_endpoint_address_target_kind]
            action: keep
            regex: Pod
          - action: labelmap
            regex: __meta_kubernetes_service_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: kubernetes_pod_name
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: kubernetes_node
          - source_labels: [__meta_kubernetes_service_name]
            regex: vllm-rerank-gpu-node-(.*)
            target_label: node
            replacement: gpu-node-$1
          - target_label: workload
            replacement: reranker
          - target_label: service
            replacement: reranker
