# layer-web-v1 — Next.js 15 BFF (/api/v1/* -> layer-gateway-api).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: layer-web
  labels:
    environment: dev
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: layer-web
  template:
    metadata:
      labels:
        environment: dev
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - server-node-1
      automountServiceAccountToken: false
      containers:
        - name: web
          image: ghcr.io/taixingbi/layer-web-v1
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: APP_URL
              value: "https://dev.taixingai.com"
            - name: GATEWAY_BASE_URL
              value: "http://layer-gateway-api:8000"
            - name: WEB_SERVICE_NAME
              value: "layer-web"
            - name: AUTH_SESSION_MAX_AGE_SECONDS
              value: "3600"
            - name: COOKIE_SECURE
              value: "true"
            # Admin dashboard (/admin) — service health, Prometheus KPIs, Supabase analytics
            - name: ORCHESTRATOR_BASE_URL
              value: "http://layer-orchestrator:8000"
            - name: RAG_QUERY_BASE_URL
              value: "http://layer-rag-query:8000"
            - name: INFERENCE_GATEWAY_BASE_URL
              value: "http://layer-gateway-inference:8000"
            - name: EMBED_GATEWAY_BASE_URL
              value: "http://layer-gateway-embedding:8000"
            - name: RERANKER_GATEWAY_BASE_URL
              value: "http://layer-gateway-reranker:8000"
            - name: QDRANT_BASE_URL
              value: "http://qdrant:6333"
            - name: REDIS_URL
              value: "redis://redis:6379/0"
            - name: PROMETHEUS_URL
              value: "http://prometheus.monitoring.svc.cluster.local:9090"
            - name: ADMIN_INFERENCE_MODEL
              value: "qwen2.5-7b"
            - name: ADMIN_EMBEDDING_MODEL
              value: "BAAI/bge-m3"
            - name: ADMIN_RERANKER_MODEL
              value: "BAAI/bge-reranker-v2-m3"
            - name: ADMIN_INFERENCE_RUNTIME
              value: "vLLM"
            - name: ADMIN_ROUTER_VERSION
              value: "router-v2"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 512Mi
