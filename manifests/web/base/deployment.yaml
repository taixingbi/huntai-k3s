# layer-web-v1 — Next.js 15 BFF (/api/v1/* -> layer-gateway-api).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: layer-web
  labels:
    environment: dev
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: layer-web
  template:
    metadata:
      labels:
        environment: dev
    spec:
      nodeSelector:
        kubernetes.io/hostname: server-node-1
      automountServiceAccountToken: false
      containers:
        - name: web
          image: docker.io/taixingbi/layer-web-v1:bb1bba22e477
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: APP_URL
              value: "https://dev.taixingai.com"
            - name: GATEWAY_BASE_URL
              value: "http://layer-gateway-api:8000"
            - name: WEB_SERVICE_NAME
              value: "layer-web"
            - name: AUTH_SESSION_MAX_AGE_SECONDS
              value: "3600"
            - name: COOKIE_SECURE
              value: "true"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 512Mi
