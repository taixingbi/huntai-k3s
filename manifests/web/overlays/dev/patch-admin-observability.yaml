# Admin logs page — Grafana Cloud Loki query API (secrets not in Git).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: layer-web
spec:
  template:
    spec:
      containers:
        - name: web
          env:
            - name: ADMIN_DEFAULT_NAMESPACE
              value: "ai-dev"
            - name: LOKI_CLUSTER
              value: "k3s"
            - name: NEXT_PUBLIC_ARGOCD_UI_URL
              value: "https://argocd.taixingai.com"
            - name: LOKI_QUERY_URL
              valueFrom:
                secretKeyRef:
                  name: layer-web-admin-secrets
                  key: LOKI_QUERY_URL
                  optional: true
            - name: LOKI_USERNAME
              valueFrom:
                secretKeyRef:
                  name: layer-web-admin-secrets
                  key: LOKI_USERNAME
                  optional: true
            - name: LOKI_READ_TOKEN
              valueFrom:
                secretKeyRef:
                  name: layer-web-admin-secrets
                  key: LOKI_READ_TOKEN
                  optional: true
