# Admin observability pages — external UI links only (no Loki or Argo CD API secrets).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: layer-web
spec:
  template:
    spec:
      containers:
        - name: web
          env:
            - name: NEXT_PUBLIC_ARGOCD_UI_URL
              value: "https://argocd.taixingai.com"
            - name: NEXT_PUBLIC_GRAFANA_BASE_URL
              value: "https://taixingbi.grafana.net"
            - name: NEXT_PUBLIC_GRAFANA_LOKI_DATASOURCE
              value: "grafanacloud-logs"
