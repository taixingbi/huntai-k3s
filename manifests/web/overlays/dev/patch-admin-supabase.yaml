# Admin dashboard reads messages + message_feedback via Supabase service role (same secret as gateway-api).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: layer-web
spec:
  template:
    spec:
      containers:
        - name: web
          env:
            - name: SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  name: layer-gateway-api-secrets
                  key: SUPABASE_URL
                  optional: true
            - name: SUPABASE_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: layer-gateway-api-secrets
                  key: SUPABASE_SERVICE_KEY
                  optional: true
            - name: ADMIN_RAG_EVAL_ENV
              value: "dev"
