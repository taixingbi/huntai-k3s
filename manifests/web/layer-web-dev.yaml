# layer-web — dev (NodePort 30186; pod + ClusterIP listen on 3000). Scheduled on server-node-1 (control plane — watch CPU/RAM).
# Next.js 15 standalone (BFF → layer-gateway-api). Source: https://github.com/taixingbi/layer-web-v1
# Requires published image docker.io/taixingbi/layer-web-v1:latest (CI) or: sudo k3s ctr images pull docker.io/taixingbi/layer-web-v1:latest
# Runtime: GATEWAY_BASE_URL in-cluster; APP_URL must match gateway FRONTEND_URL (password reset redirect). Auth via /login → gateway Supabase.

apiVersion: v1
kind: Namespace
metadata:
  name: ai-dev
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: layer-web
  namespace: ai-dev
  labels:
    app: layer-web
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: layer-web
  template:
    metadata:
      labels:
        app: layer-web
        environment: dev
    spec:
      nodeSelector:
        kubernetes.io/hostname: server-node-1
      automountServiceAccountToken: false
      containers:
        - name: web
          image: docker.io/taixingbi/layer-web-v1:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: APP_URL
              value: "http://192.168.86.179:30186"
            - name: GATEWAY_BASE_URL
              value: "http://layer-gateway-api:8000"
            - name: WEB_SERVICE_NAME
              value: "layer-web"
            - name: AUTH_SESSION_MAX_AGE_SECONDS
              value: "3600"
            - name: COOKIE_SECURE
              value: "false"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: layer-web
  namespace: ai-dev
  labels:
    app: layer-web
    environment: dev
spec:
  type: NodePort
  selector:
    app: layer-web
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30186
