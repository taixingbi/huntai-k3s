apiVersion: v1
kind: Service
metadata:
  name: qdrant
  labels:
    app: qdrant
    environment: dev
spec:
  type: ClusterIP
  selector:
    app: qdrant
  ports:
    - name: http
      port: 6333
      targetPort: http
    - name: grpc
      port: 6334
      targetPort: grpc
---
# LAN smoke / host ingest (layer-rag-ingest-v1). In-cluster clients use ClusterIP `qdrant:6333`.
apiVersion: v1
kind: Service
metadata:
  name: qdrant-lan
  labels:
    app: qdrant
    environment: dev
spec:
  type: NodePort
  selector:
    app: qdrant
  ports:
    - name: http
      port: 6333
      targetPort: http
      nodePort: 30633
