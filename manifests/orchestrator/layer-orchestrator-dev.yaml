# Orchestrator — dev (NodePort 30184; pod + ClusterIP listen on 8000). Scheduled on server-node-1 (control plane — watch CPU/RAM).
# FastAPI service with HTTP chat completions + HTTP RAG + /orchestrator/stream-answer (SSE).
# Image / source: https://github.com/taixingbi/layer-orchestrator-v1
#
# Optional: sudo k3s ctr images pull docker.io/taixingbi/layer-orchestrator-v1:latest

apiVersion: v1
kind: Namespace
metadata:
  name: ai-dev
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: layer-orchestrator
  namespace: ai-dev
  labels:
    app: layer-orchestrator
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: layer-orchestrator
  template:
    metadata:
      labels:
        app: layer-orchestrator
        environment: dev
    spec:
      nodeSelector:
        kubernetes.io/hostname: server-node-1
      automountServiceAccountToken: false
      containers:
        - name: orchestrator
          image: docker.io/taixingbi/layer-orchestrator-v1:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: APP_NAME
              value: "layer-orchestrator-v1"
            - name: APP_VERSION
              value: "dev"
            - name: ENV
              value: "dev"
            - name: LOG_LEVEL
              value: "INFO"
            - name: LLM_GATEWAY_BASE_URL
              value: "http://layer-gateway-inference:8000"
            - name: LLM_MODEL
              value: "Qwen/Qwen2.5-7B-Instruct"
            - name: ROUTER_PROMPT_VERSION
              value: "router-v2.0.0"
            - name: LLM_API_KEY
              value: "not-used-in-dev"
            - name: RAG_HTTP_BASE_URL
              value: "http://layer-rag-query:8000"
            - name: RAG_COLLECTION_BASE
              value: "taixing_knowledge"
            - name: RAG_K
              value: "5"
            - name: RAG_K_MAX
              value: "40"
            - name: RAG_INCLUDE_RETRIEVAL_HITS
              value: "true"
            - name: TOOLS_TIMEOUT_S
              value: "60"
            - name: INVOKE_TIMEOUT_S
              value: "120"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: layer-orchestrator
  namespace: ai-dev
  labels:
    app: layer-orchestrator
    environment: dev
spec:
  type: NodePort
  selector:
    app: layer-orchestrator
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 30184
