# Orchestrator — FastAPI: intent router + POST /orchestrator/answer (JSON or SSE).
# Source: https://github.com/taixingbi/layer-orchestrator-v1
# Secrets: layer-orchestrator-secrets (see docs/deploy-orchestrator.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: layer-orchestrator
  labels:
    environment: dev
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: layer-orchestrator
  template:
    metadata:
      labels:
        environment: dev
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - server-node-1
      automountServiceAccountToken: false
      containers:
        - name: orchestrator
          image: ghcr.io/taixingbi/layer-orchestrator-v1:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: layer-orchestrator-secrets
          env:
            - name: APP_NAME
              value: "layer-orchestrator-v1"
            - name: APP_VERSION
              value: "dev"
            - name: ENV
              value: "dev"
            - name: LOG_LEVEL
              value: "INFO"
            - name: LLM_GATEWAY_BASE_URL
              value: "http://layer-gateway-inference:8000"
            - name: LLM_MODEL
              value: "Qwen/Qwen2.5-7B-Instruct"
            - name: ROUTER_MODEL
              value: "router-qwen2.5-7b-sft-v1.00"
            - name: ROUTER_PROMPT_VERSION
              value: "router-v2.01-compact"
            - name: LLM_API_KEY
              value: "not-used-in-dev"
            - name: RAG_HTTP_BASE_URL
              value: "http://layer-rag-query:8000"
            - name: RAG_COLLECTION_BASE
              value: "taixing_knowledge"
            - name: RAG_K
              value: "5"
            - name: RAG_K_MAX
              value: "40"
            - name: RAG_INCLUDE_RETRIEVAL_HITS
              value: "true"
            - name: USE_MCP_TOOLS
              value: "true"
            - name: MCP_GITHUB_BASE_URL
              value: "http://layer-mcp-github-v1:8000"
            - name: TOOLS_TIMEOUT_S
              value: "60"
            - name: INVOKE_TIMEOUT_S
              value: "120"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
