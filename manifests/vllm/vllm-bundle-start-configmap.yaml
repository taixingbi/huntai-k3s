# Entrypoint for vLLM bundle (C1): one container, three vLLM processes on one GPU.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vllm-bundle-start
  namespace: vllm
data:
  prefetch-hf-models.sh: |
    #!/usr/bin/env bash
    # InitContainer: snapshot_download into HF_HOME (hostPath) before vLLM holds the GPU.
    set -euo pipefail
    export HF_HOME="${HF_HOME:-/root/.cache/huggingface}"
    mkdir -p "${HF_HOME}"
    exec python3 -u /scripts/prefetch_hf_models.py

  prefetch_hf_models.py: |
    import os
    import sys

    from huggingface_hub import snapshot_download

    def log(msg: str) -> None:
        print(f"[prefetch] {msg}", flush=True)

    def main() -> None:
        cache_dir = os.environ.get("HF_HOME", "/root/.cache/huggingface")
        os.makedirs(cache_dir, exist_ok=True)
        token = os.environ.get("HF_TOKEN") or os.environ.get("HUGGING_FACE_HUB_TOKEN")

        repos = [
            "BAAI/bge-m3",
            "BAAI/bge-reranker-v2-m3",
            "Qwen/Qwen2.5-7B-Instruct",
        ]
        if os.environ.get("PREFETCH_ROUTER_LORAS", "false").lower() == "true":
            repos.extend(
                [
                    "taixingbi/router-qwen2.5-7b-sft-v1.00",
                    "taixingbi/router-qwen2.5-7b-dpo-v1.00",
                ]
            )

        for repo_id in repos:
            log(f"ensuring {repo_id} in {cache_dir}")
            snapshot_download(
                repo_id=repo_id,
                cache_dir=cache_dir,
                token=token,
            )
            log(f"ok {repo_id}")

        log("all models present in cache")

    if __name__ == "__main__":
        try:
            main()
        except Exception as exc:
            print(f"[prefetch] failed: {exc}", file=sys.stderr, flush=True)
            raise

  start-vllm-bundle.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    log() { echo "[bundle] $*"; }

    trap 'log "shutting down"; jobs -p | xargs -r kill 2>/dev/null || true' EXIT TERM INT

    # vLLM: embed needs --runner pooling; rerank/score models auto-detect on latest images.
    # On a 24GB GPU, each process uses gpu-memory-utilization * full VRAM independently;
    # keep sum ~0.95 and start small models before chat (chat weights ~15.5GiB + KV).
    wait_for_health() {
      # 5s sleep between attempts; cold HF pulls for bge-m3 can exceed 15m.
      local port="$1" name="$2" max_attempts="${3:-360}"
      for ((i = 1; i <= max_attempts; i++)); do
        if python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${port}/health', timeout=3)" 2>/dev/null; then
          log "$name ready on :$port"
          return 0
        fi
        sleep 5
      done
      log "timeout waiting for $name on :$port"
      return 1
    }

    log "starting embed (BAAI/bge-m3) on :8001"
    # Dense RAG embeddings only: use standard pooling + task=embed for /v1/embeddings.
    # BgeM3EmbeddingModel hf-overrides enables sparse/colbert via /pooling but breaks OpenAI API (501).
    vllm serve BAAI/bge-m3 \
      --host 0.0.0.0 --port 8001 \
      --runner pooling \
      --pooler-config '{"task":"embed"}' \
      --enforce-eager \
      --gpu-memory-utilization 0.08 \
      --max-model-len 8192 \
      &

    log "starting rerank (BAAI/bge-reranker-v2-m3) on :8002"
    vllm serve BAAI/bge-reranker-v2-m3 \
      --host 0.0.0.0 --port 8002 \
      --gpu-memory-utilization 0.05 \
      --max-model-len 512 \
      &

    log "waiting for embed /health on :8001 (up to 40m)"
    wait_for_health 8001 embed 480
    log "waiting for rerank /health on :8002 (up to 30m)"
    wait_for_health 8002 rerank 360

    # Chat: embed+rerank leave ~3–4GiB used; vLLM checks util * total_VRAM <= free at startup.
    # On a 24GB card with ~20GiB free, util must stay ~<=0.84 (0.86 needs 20.26GiB and fails init).
    # enforce-eager avoids extra CUDA-graph reservation; max-loras 2 matches the two router adapters.
    log "starting chat (Qwen2.5-7B-Instruct + LoRA) on :8000"
    vllm serve Qwen/Qwen2.5-7B-Instruct \
      --host 0.0.0.0 --port 8000 \
      --gpu-memory-utilization 0.84 \
      --max-model-len 2048 \
      --max-num-seqs 1 \
      --enforce-eager \
      --enable-lora \
      --max-lora-rank 64 \
      --max-loras 2 \
      --lora-modules router-qwen2.5-7b-sft-v1.00=taixingbi/router-qwen2.5-7b-sft-v1.00 router-qwen2.5-7b-dpo-v1.00=taixingbi/router-qwen2.5-7b-dpo-v1.00 \
      &

    log "all vLLM processes launched; waiting for any exit"
    while true; do
      if ! wait -n; then
        log "a vLLM process exited with error"
        exit 1
      fi
    done

  healthcheck.py: |
    import json
    import sys
    import urllib.error
    import urllib.request

    def check_health(name: str, port: int) -> None:
        url = f"http://127.0.0.1:{port}/health"
        urllib.request.urlopen(url, timeout=3)

    def check_embed_api() -> None:
        body = json.dumps({"model": "BAAI/bge-m3", "input": "ping"}).encode()
        req = urllib.request.Request(
            "http://127.0.0.1:8001/v1/embeddings",
            data=body,
            headers={"Content-Type": "application/json"},
            method="POST",
        )
        with urllib.request.urlopen(req, timeout=10) as resp:
            if resp.status >= 400:
                raise urllib.error.HTTPError(
                    req.full_url, resp.status, "embed probe failed", resp.headers, None
                )
            payload = json.loads(resp.read().decode("utf-8") or "{}")
        if not isinstance(payload, dict) or not payload.get("data"):
            err = payload.get("error") if isinstance(payload, dict) else payload
            raise RuntimeError(f"embed probe empty response: {err!r}")

    endpoints = (("chat", 8000), ("embed", 8001), ("rerank", 8002))
    failed = []
    for name, port in endpoints:
        url = f"http://127.0.0.1:{port}/health"
        try:
            check_health(name, port)
            print(f"ok {name} {url}")
        except (urllib.error.URLError, TimeoutError, urllib.error.HTTPError) as e:
            print(f"FAIL {name} {url}: {e}", file=sys.stderr)
            failed.append(name)
    if not failed:
        try:
            check_embed_api()
            print("ok embed /v1/embeddings")
        except Exception as e:
            print(f"FAIL embed /v1/embeddings: {e}", file=sys.stderr)
            failed.append("embed_api")
    if failed:
        print(f"not ready: {', '.join(failed)}", file=sys.stderr)
        sys.exit(1)
    sys.exit(0)
