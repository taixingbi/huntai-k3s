apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/taixingbi/k3s-huntai.git
    targetRevision: main
    path: manifests/gateway-api/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: ai-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
