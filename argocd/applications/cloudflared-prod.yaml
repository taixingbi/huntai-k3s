apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudflared-prod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "12"
spec:
  project: platform
  source:
    repoURL: https://github.com/taixingbi/huntai-k3s.git
    targetRevision: main
    path: manifests/ingress/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: ai-prod
  # Manual sync: set prod tunnel UUID in ConfigMap and create credentials Secret first.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
